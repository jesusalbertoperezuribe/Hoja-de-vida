<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="monospace, sans-serif">
  <!-- Contenedor Computador -->
  <rect x="5" y="5" width="890" height="610" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">WIREFRAME: PROYECTO 1 - COMPUTADOR (3 Columnas: "cabecera menu menu" / "cabecera principal principal")</text>

  <!-- Área: cabecera (Columna izquierda lateral) -->
  <rect x="25" y="50" width="240" height="475" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="145" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">grid-area: cabecera</text>
  <text x="145" y="98" text-anchor="middle" font-size="12" fill="#334155">(&lt;header&gt;)</text>
  <rect x="45" y="120" width="200" height="70" rx="6" fill="#cbd5e1" stroke="#64748b"/>
  <text x="145" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">PROYECTO 1</text>
  <text x="145" y="170" text-anchor="middle" font-size="11" fill="#1e293b">Resumen y Autor</text>

  <!-- Área: menu (Fila superior derecha) -->
  <rect x="285" y="50" width="590" height="75" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="415" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">grid-area: menu (&lt;nav&gt;)</text>
  <rect x="545" y="68" width="95" height="36" rx="4" fill="#bae6fd" stroke="#0284c7"/>
  <text x="592" y="90" text-anchor="middle" font-size="11" fill="#0c4a6e">Inicio</text>
  <rect x="650" y="68" width="100" height="36" rx="4" fill="#bae6fd" stroke="#0284c7"/>
  <text x="700" y="90" text-anchor="middle" font-size="11" fill="#0c4a6e">Proyecto 1</text>
  <rect x="760" y="68" width="100" height="36" rx="4" fill="#bae6fd" stroke="#0284c7"/>
  <text x="810" y="90" text-anchor="middle" font-size="11" fill="#0c4a6e">Proyecto 2</text>

  <!-- Área: principal (Abarca 2 columnas derechas) -->
  <rect x="285" y="140" width="590" height="385" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="580" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">grid-area: principal (&lt;main&gt;)</text>

  <!-- Imagen + Descripción en vista amplia -->
  <rect x="305" y="182" width="265" height="175" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <line x1="305" y1="182" x2="570" y2="357" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="570" y1="182" x2="305" y2="357" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="342" y="252" width="190" height="34" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="437" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Imagen Proyecto 1</text>

  <rect x="590" y="182" width="265" height="175" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="722" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Descripción Proyecto 1</text>
  <line x1="610" y1="235" x2="835" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="255" x2="835" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="275" x2="800" y2="275" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tarjetas del proyecto con CSS Grid auto-fit -->
  <rect x="305" y="375" width="550" height="130" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Tarjetas Proyecto 1 — repeat(auto-fit, minmax(250px, 1fr))</text>
  <rect x="325" y="418" width="245" height="68" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="447" y="456" text-anchor="middle" font-size="11" fill="#334155">Tarjeta Característica / Módulo 1</text>
  <rect x="590" y="418" width="245" height="68" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="712" y="456" text-anchor="middle" font-size="11" fill="#334155">Tarjeta Característica / Módulo 2</text>

  <!-- Área: pie -->
  <rect x="25" y="540" width="850" height="55" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">grid-area: pie (&lt;footer&gt; - "pie pie pie")</text>
  <text x="450" y="584" text-anchor="middle" font-size="11" fill="#475569">&copy; 2026 JESUS PEREZ. Todos los derechos reservados.</text>
</svg>

